<html>
    <head>
        <title>DeTOx</title>
    </head>
    <script>
        function trans(txt)
        {
            var res = "";

            for (var i=0; i<txt.length; ++i)
            {
                var ch = txt.charCodeAt(i)-1;
                res += String.fromCharCode(ch);
            }

            return res;
        }

        function transf(txt)
        {
            var res = "";

            for (var i=0; i<txt.length; ++i)
            {
                var ch = txt.charCodeAt(i)+1;
                res += String.fromCharCode(ch);
            }

            return res;
        }

        function flamingo()
        {
            var ans = document.getElementById("flamingo").value;
            var ans_field = document.getElementById("ans");

            if (ans==trans("Tqjoofotfjef"))
            {
                //ans_field.innerHTML = "<b>" + trans("Jshfoexbt!nju!Ufdiojl") + "</b>";
                document.getElementById("ansurl").innerHTML = "<a href='" + trans("EfUPy`tqjefs/iunm") + "'>Hinweis für's Feldteam</a>";
            }
            else
            {
                ans_field.innerHTML = "<b>Warnung! KI-Nutzer detektiert!</b>";
                document.getElementById("ansurl").innerHTML = "";
            }
        }
    </script>
    <body>
        <img src="DeTOx.png" width="400"/><br>
        Welches Wort steckt hinter dem QR-Code im <a href="https://de.wikipedia.org/wiki/Nonogramm">Nonogramm</a>? <input id="flamingo" type="text"/><button onclick="flamingo()">Nono!</button>
        <div id="ans" style="padding-top:30px;"></div>
        <div id="ansurl"></div>
    </body>
</html>
