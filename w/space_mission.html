        function toggle_text(which)
        {
            var token = document.getElementById(which);
            
            if (token.style.visibility == "hidden")

                token.style.visibility = "visible";
                total_sum += parseInt(which.substring(1));
            }
            else
            {
                token.style.visibility = "hidden";
                total_sum -= parseInt(which.substring(1));
            }

        }
